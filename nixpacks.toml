[phases.setup]
nixPkgs = ["...", "nodejs_20"]

[phases.build]
cmds = [
    "npm ci",
    "npm run build",
    "mkdir -p storage/framework/{sessions,views,cache/data} storage/logs bootstrap/cache",
    "chmod -R 775 storage bootstrap/cache"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link --force 2>/dev/null || true && php artisan serve --host=0.0.0.0 --port=$PORT"
