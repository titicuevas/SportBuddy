services:
  postgres:
    image: postgres:16-alpine
    container_name: sportbuddy-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sportbuddy}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - sportbuddy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-sportbuddy}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sportbuddy_pg_data:
